[project]
name = "paismart-backend"
version = "0.1.0"
description = "Paismart RAG Backend - FastAPI + LLM + Vector Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "elasticsearch>=8.14.0,<9",
    "pymilvus>=2.4.0",
    "minio>=7.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
    "python-pptx>=1.0.0",
    "pandas>=2.2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH", "TRY"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "elasticsearch.*",
    "pymilvus.*",
    "minio.*",
    "langchain.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
